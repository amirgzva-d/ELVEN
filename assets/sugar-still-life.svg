 <text x="272" y="221" fill="#fffdf4" font-family="Tahoma,Arial,sans-serif" font-size="28" font-weight="bold" text-anchor="middle">MOHAJER</text>
 <text x="272" y="302" fill="#143668" font-family="Tahoma,Arial,sans-serif" font-size="68" font-weight="bold" text-anchor="middle">SUGAR</text>
 <text x="272" y="347" fill="#ad7c3a" font-family="Tahoma,Arial,sans-serif" font-size="29" font-weight="bold" text-anchor="middle">REFINED WHITE</text>
