<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
<title id="title">تصویرسازی شکر صادراتی</title><desc id="desc">کیسه شکر سفید، کاسه شکر بلوری، مکعب‌های شکر و خوشه‌های نی‌شکر روی پس‌زمینه روشن و لوکس</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset=".6" stop-color="#f5ebd8"/><stop offset="1" stop-color="#e9d8bb"/></linearGradient>
 <linearGradient id="bag" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#e2ddd5"/><stop offset=".18" stop-color="#fff"/><stop offset=".55" stop-color="#fffdfa"/><stop offset=".85" stop-color="#ddd7cf"/><stop offset="1" stop-color="#f4f1ec"/></linearGradient>
 <linearGradient id="bagSide" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c6bbad"/><stop offset=".5" stop-color="#fffefa"/><stop offset="1" stop-color="#cfc5ba"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#a06432"/><stop offset=".52" stop-color="#e0a66b"/><stop offset="1" stop-color="#764722"/></linearGradient>
 <linearGradient id="sugar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#fffefa"/><stop offset="1" stop-color="#e8e6e0"/></linearGradient>
 <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6e1"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
 <pattern id="grains" patternUnits="userSpaceOnUse" width="23" height="21"><circle cx="3" cy="6" r="1.7" fill="#e4ded1"/><circle cx="13" cy="12" r="1.4" fill="#cfc9bd"/><circle cx="20" cy="2" r="1" fill="#fff"/></pattern>
 <pattern id="weave" patternUnits="userSpaceOnUse" width="7" height="7"><path d="M0 0L7 7M7 0L0 7" stroke="#a89f92" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1300" height="760" fill="url(#bg)"/>
