<ellipse cx="500" cy="560" rx="238" ry="66" fill="#8f613d" stroke="#825331" stroke-width="7"/>
<ellipse cx="503" cy="543" rx="222" ry="46" fill="#fffdf9"/>
<path d="M296 537Q353 482 425 456Q482 421 530 447Q626 473 709 537Z" fill="url(#sugar)" stroke="#ebe7de" stroke-width="4"/>
