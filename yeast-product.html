.brand-slider-container{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;gap:1.5rem;padding:0 4rem;margin-top:1rem}.brand-slider{display:flex;gap:1.25rem;overflow-x:auto;scroll-behavior:smooth;padding:1rem 0;scrollbar-width:none;-ms-overflow-style:none}.brand-slider::-webkit-scrollbar{display:none}
.brand-card{background:#fff;border-radius:16px;padding:1.5rem 2rem;min-width:200px;height:110px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px #0000000f;border:1px solid #00000008;transition:transform .3s,box-shadow .3s;flex-shrink:0}.brand-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px #0000001a}.brand-card img{max-width:100%;max-height:70px;object-fit:contain}

.hero__content{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:left;margin-right:auto;margin-left:4rem;padding:2rem 0;max-width:55%;margin-top:-50px}
.hero__title{font-size:clamp(2rem,4vw,3.5rem);font-weight:800;color:#1a6a45;margin-bottom:1.5rem;line-height:1.4}.hero__subtitle{font-size:clamp(1rem,1.8vw,1.3rem);color:#222;line-height:2;margin-bottom:3rem;font-weight:600}
.action-cards{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:2.5rem;justify-content:flex-start}.action-card{display:flex;align-items:center;gap:.75rem;background:#fff;padding:.75rem 1.25rem;border-radius:12px;text-decoration:none;color:#333;font-weight:600;font-size:.9rem;box-shadow:0 4px 15px #0000001a;border:1px solid #0000000d;transition:all .3s}.action-card i{color:#1a6a45;font-size:1.1rem}.action-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #1a6a4526;border-color:#1a6a4533}
.btn{display:inline-flex;align-items:center;gap:.75rem;padding:1rem 2.5rem;border-radius:50px;font-size:1.05rem;font-weight:700;text-decoration:none;transition:all .3s;cursor:pointer;border:2px solid transparent}.btn--primary{background:#1a6a45;color:#fff;box-shadow:0 8px 24px #1a6a4533}.btn--primary:hover{background:#0d3b24;transform:translateY(-2px);box-shadow:0 12px 32px #1a6a4566}.btn-inquiry i{font-size:1rem;transition:transform .3s}.btn-inquiry:hover i{transform:translateX(-4px)}
@media(max-width:992px){.navbar{padding:1.5rem 2rem}.nav-links{gap:1.5rem}.brand-slider-container{padding:0 2rem}.brand-card{min-width:160px;height:90px;padding:1rem}.hero__content{max-width:100%;padding:2rem;align-items:center;text-align:center;margin:0}.action-cards{justify-content:center}}
@media(max-width:768px){.navbar{flex-wrap:wrap;gap:1rem;padding:1rem}.nav-links{order:3;width:100%;justify-content:center;flex-wrap:wrap;gap:1rem;margin-top:.5rem}.brand-slider-container{padding:0 1rem;gap:.5rem}.slider-arrow{width:35px;height:35px;font-size:.9rem}.brand-card{min-width:140px;height:80px;padding:.75rem}.hero__content{padding:1rem}.action-cards{justify-content:center}.btn-inquiry{width:100%;justify-content:center}}

<script>
const slider=document.querySelector('.brand-slider');
document.querySelector('.slider-arrow.left').addEventListener('click',()=>slider.scrollBy({left:slider.scrollWidth,behavior:'smooth'}));
document.querySelector('.slider-arrow.right').addEventListener('click',()=>slider.scrollBy({left:-slider.scrollWidth,behavior:'smooth'}));
document.getElementById('shareLink').addEventListener('click',async e=>{e.preventDefault();try{await navigator.clipboard.writeText(location.href);e.currentTarget.querySelector('span').textContent='لینک کپی شد';}catch{e.currentTarget.querySelector('span').textContent='اشتراک گذاری';}});
